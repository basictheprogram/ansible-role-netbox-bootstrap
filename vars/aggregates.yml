    rir: rfc-1918-private
    description: "RFC 1918 — Class A private range"
  - prefix: "172.16.0.0/12"
    rir: rfc-1918-private
    description: "RFC 1918 — Class B private range"
  - prefix: "192.168.0.0/16"
    rir: rfc-1918-private
    description: "RFC 1918 — Class C private range"
