---
- name: Load webhooks var file
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/webhooks.yml"
  when: webhooks is not defined

- name: Ensure webhooks exist
  netbox.netbox.netbox_webhook:
    netbox_url: "{{ netbox_url }}"
    netbox_token: "{{ netbox_api_token }}"
    validate_certs: "{{ netbox_validate_certs }}"
    data: "{{ item }}"
    state: present
  loop: "{{ webhooks | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
