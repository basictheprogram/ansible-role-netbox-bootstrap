---
- name: Load locations var file
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/locations.yml"
  when: locations is not defined

- name: Ensure locations exist
  netbox.netbox.netbox_location:
    netbox_url: "{{ netbox_url }}"
    netbox_token: "{{ netbox_api_token }}"
    validate_certs: "{{ netbox_validate_certs }}"
    data: "{{ item }}"
    state: present
  loop: "{{ locations | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
