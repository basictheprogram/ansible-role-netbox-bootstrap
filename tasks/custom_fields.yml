---
- name: Load custom_fields var file
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/custom_fields.yml"

- name: Ensure custom fields exist
  netbox.netbox.netbox_custom_field:
    netbox_url: "{{ netbox_url }}"
    netbox_token: "{{ netbox_api_token }}"
    validate_certs: "{{ netbox_validate_certs }}"
    data: "{{ item }}"
    state: present
  loop: "{{ custom_fields | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
