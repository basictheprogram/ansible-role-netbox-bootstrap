---
- name: Load cluster_types var file
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/cluster_types.yml"
  when: cluster_types is not defined

- name: Ensure cluster types exist
  netbox.netbox.netbox_cluster_type:
    netbox_url: "{{ netbox_url }}"
    netbox_token: "{{ netbox_api_token }}"
    validate_certs: "{{ netbox_validate_certs }}"
    data: "{{ item }}"
    state: present
  loop: "{{ cluster_types | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
