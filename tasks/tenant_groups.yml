---
- name: Load tenant_groups var file
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/tenant_groups.yml"

- name: Ensure tenant_groups exist
  netbox.netbox.netbox_tenant_group:
    netbox_url: "{{ netbox_url }}"
    netbox_token: "{{ netbox_api_token }}"
    validate_certs: "{{ netbox_validate_certs }}"
    data: "{{ item }}"
    state: present
  loop: "{{ tenant_groups | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
