---
- name: Load platforms var file
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/platforms.yml"
  when: platforms is not defined

- name: Ensure platforms exist
  netbox.netbox.netbox_platform:
    netbox_url: "{{ netbox_url }}"
    netbox_token: "{{ netbox_api_token }}"
    validate_certs: "{{ netbox_validate_certs }}"
    data: "{{ item }}"
    state: present
  loop: "{{ platforms | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
