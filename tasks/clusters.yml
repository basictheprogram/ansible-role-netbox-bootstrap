---
# cluster_types must exist before clusters (Tier 6 dependency).
- name: Load clusters var file
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/clusters.yml"
  when: clusters is not defined

- name: Ensure clusters exist
  netbox.netbox.netbox_cluster:
    netbox_url: "{{ netbox_url }}"
    netbox_token: "{{ netbox_api_token }}"
    validate_certs: "{{ netbox_validate_certs }}"
    data: "{{ item }}"
    state: present
  loop: "{{ clusters | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
