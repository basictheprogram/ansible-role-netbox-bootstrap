---
# Groups — uses uri (netbox.netbox has no stable netbox_group module)
- name: Load groups var file
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/groups.yml"

- name: Ensure groups exist
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/users/groups/"
    method: POST
    headers:
      Authorization: "Token {{ netbox_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ item.name }}"
    status_code: [200, 201, 400]
    validate_certs: "{{ netbox_validate_certs }}"
  loop: "{{ groups | default([]) }}"
  register: _group_results
  changed_when: _group_results.status == 201
  # 400 is returned when the group already exists (duplicate name); treat as ok.
  failed_when: >
    _group_results.status not in [200, 201, 400] or
    (_group_results.status == 400 and
     'already exists' not in (_group_results.json | to_json))
