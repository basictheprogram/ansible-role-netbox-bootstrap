---
- name: Load manufacturers var file
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/manufacturers.yml"
  when: manufacturers is not defined

- name: Ensure manufacturers exist
  netbox.netbox.netbox_manufacturer:
    netbox_url: "{{ netbox_url }}"
    netbox_token: "{{ netbox_api_token }}"
    validate_certs: "{{ netbox_validate_certs }}"
    data: "{{ item }}"
    state: present
  loop: "{{ manufacturers | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
