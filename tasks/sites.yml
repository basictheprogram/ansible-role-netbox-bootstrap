---
- name: Load sites var file
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/sites.yml"

- name: Ensure sites exist
  netbox.netbox.netbox_site:
    netbox_url: "{{ netbox_url }}"
    netbox_token: "{{ netbox_api_token }}"
    validate_certs: "{{ netbox_validate_certs }}"
    data: "{{ item }}"
    state: present
  loop: "{{ sites | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
