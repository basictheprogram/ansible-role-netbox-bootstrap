---
- name: Load rack_roles var file
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/rack_roles.yml"
  when: rack_roles is not defined

- name: Ensure rack_roles exist
  netbox.netbox.netbox_rack_role:
    netbox_url: "{{ netbox_url }}"
    netbox_token: "{{ netbox_api_token }}"
    validate_certs: "{{ netbox_validate_certs }}"
    data: "{{ item }}"
    state: present
  loop: "{{ rack_roles | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
