---
- name: Load regions var file
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/regions.yml"

- name: Ensure regions exist
  netbox.netbox.netbox_region:
    netbox_url: "{{ netbox_url }}"
    netbox_token: "{{ netbox_api_token }}"
    validate_certs: "{{ netbox_validate_certs }}"
    data: "{{ item }}"
    state: present
  loop: "{{ regions | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
