---
- name: Load device_types var file
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/device_types.yml"
  when: device_types is not defined

- name: Ensure device_types exist
  netbox.netbox.netbox_device_type:
    netbox_url: "{{ netbox_url }}"
    netbox_token: "{{ netbox_api_token }}"
    validate_certs: "{{ netbox_validate_certs }}"
    data: "{{ item }}"
    state: present
  loop: "{{ device_types | default([]) }}"
  loop_control:
    label: "{{ item.model }}"
