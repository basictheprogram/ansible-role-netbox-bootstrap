---
- name: Load ipam_roles var file
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/ipam_roles.yml"
  when: ipam_roles is not defined

- name: Ensure IPAM roles exist
  netbox.netbox.netbox_role:
    netbox_url: "{{ netbox_url }}"
    netbox_token: "{{ netbox_api_token }}"
    validate_certs: "{{ netbox_validate_certs }}"
    data: "{{ item }}"
    state: present
  loop: "{{ ipam_roles | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
