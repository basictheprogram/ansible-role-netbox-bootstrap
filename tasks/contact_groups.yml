---
- name: Load contact_groups var file
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/contact_groups.yml"
  when: contact_groups is not defined

- name: Ensure contact groups exist
  netbox.netbox.netbox_contact_group:
    netbox_url: "{{ netbox_url }}"
    netbox_token: "{{ netbox_api_token }}"
    validate_certs: "{{ netbox_validate_certs }}"
    data: "{{ item }}"
    state: present
  loop: "{{ contact_groups | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
